name: node-release

# Push a tag like node-v0.1.0 to publish node/ to npm.
# npm Trusted Publishing (OIDC): no npm token is stored in this repository.
# Configure it once on npmjs.com: package settings -> Trusted Publisher ->
# GitHub Actions, repository kaylovh/vault-env-loader, workflow node-release.yml.
on:
  push:
    tags: ['node-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json and VERSION
        run: |
          tag="${GITHUB_REF_NAME#node-v}"
          pkg="$(node -p "require('./package.json').version")"
          lib="$(node -p "require('./index.cjs').VERSION")"
          test "$tag" = "$pkg" && test "$tag" = "$lib" || { echo "tag $tag, package.json $pkg, index.cjs $lib"; exit 1; }
      - run: node --test test/spec.test.cjs test/client.test.cjs
      - run: npm publish --provenance --access public
