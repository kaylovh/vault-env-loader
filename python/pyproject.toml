[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-env-loader"
dynamic = ["version"]
description = "Load HashiCorp Vault KV secrets into environment variables before your app starts. Zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaylov H" }]
requires-python = ">=3.6"
keywords = ["vault", "hashicorp", "secrets", "env", "environment", "dotenv", "kv", "config"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/kaylovh/vault-env-loader/tree/main/python#readme"
Source = "https://github.com/kaylovh/vault-env-loader"
Issues = "https://github.com/kaylovh/vault-env-loader/issues"

[project.scripts]
vault-env-loader = "vault_env_loader:_cli"

[tool.setuptools]
py-modules = ["vault_env_loader"]

[tool.setuptools.dynamic]
version = { attr = "vault_env_loader.__version__" }
